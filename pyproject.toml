[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "researchgap-finder"
version = "0.5.0"
description = "MCP addon: finds literature and suggests doctoral thesis knowledge gaps."
license = "MIT"
requires-python = ">=3.10"
dependencies = ["mcp>=2", "requests", "cryptography"]

[project.scripts]
researchgap-finder = "server:main"
researchgap-finder-online = "server:main_online"

[tool.setuptools]
py-modules = ["server", "core"]
