[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "research-gap-finder"
version = "0.2.0"
description = "MCP addon: finds literature and suggests doctoral thesis knowledge gaps."
license = "MIT"
requires-python = ">=3.10"
dependencies = ["mcp>=2", "requests"]

[project.scripts]
research-gap-finder = "server:main"

[tool.setuptools]
py-modules = ["server"]
