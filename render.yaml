# Render blueprint for the online addon (used by ChatGPT, Claude, ...).
services:
  - type: web
    name: researchgap-finder
    runtime: python
    plan: free
    buildCommand: pip install .
    startCommand: researchgap-finder-online
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: SECRET_KEY
        generateValue: true
      # Shown on the privacy and support pages. Set them in Render → Environment.
      - key: DEVELOPER_NAME
        sync: false
      - key: SUPPORT_EMAIL
        sync: false
      # Token from the OpenAI plugin portal (domain verification). Set it in Render → Environment.
      - key: OPENAI_APPS_CHALLENGE
        sync: false
